<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music collection</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="container">
        <h2>My music collection</h2>
        <hr>
        <div class="content">
            <div class="month">January</div>
            <div class="month">February</div>
            <div class="month">March</div>
            <div class="month">April</div>
            <div class="month">May</div>
            <div class="month">June</div>
            <div class="month">July</div>
            <div class="month">August</div>
            <div class="month">September</div>
            <div class="month">October</div>
            <div class="month">November</div>
            <div class="month">December</div>

        </div>

        <div class="song-panel">

            <span class="close-btn">✕</span>

            <h2 id="month-title">January</h2>

            <div class="add-song">
                <input type="text" id="song-name" placeholder="enter the song name">
                <input type="url" id="song-url" placeholder="enter your song url">
                <button id="add-song">add song</button>
            </div>


            <ul id="song-list"></ul>

        </div>

    </div>

    <script src="Script.js"></script>
</body>

</html>
